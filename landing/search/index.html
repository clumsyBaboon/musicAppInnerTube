<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common/slidebar.css">
    <link rel="stylesheet" href="../common/loading.css">
    <link rel="stylesheet" href="../common/musicbar.css">
    <link rel="stylesheet" href="../common/context.css">
</head>
<body>
    <div class="wrapper">
        <div class="titlebar"></div>

        <div class="slidebar">
            <img src="../img/settings.svg" alt="settings" id="settings">
            <div class="buttons">
                <button class="active">
                    <img src="../img/search.svg" alt="search">
                    <p>Search</p>
                </button>
                <button onclick="window.location.href = '../library/index.html' ">
                    <img src="../img/library.svg" alt="library">
                    <p>Library</p>
                </button>
                <button>
                    <img src="../img/coverflow.svg" alt="coverflow">
                    <p>Coverflow</p>
                </button>
            </div>
            <button id="account-btn">
                <img src="" alt="" id="account-img">
                <div id="scrolling-wrapper">
                    <p id="account-name">Name</p>
                </div>
            </button>
        </div>

        <div class="context-menu" id="context-search">
            <div class="item play-next">
                <img src="../img/insert.svg">
                <p class="main">Play next</p>
                <p class="shortcut"></p>
            </div>
            <div class="item add-to-queue">
                <img src="../img/append.svg">
                <p class="main">Add to queue</p>
                <p class="shortcut"></p>
            </div>
        </div>

        <div class="result">
            <img src="../img/loading.png" class="loading" id="search-loading">
            <div class="search-input-wrapper">
                <img src="../img/search.svg">
                <input type="text" id="search-input" placeholder="Search">
            </div>
            <template id="main-song-template">
                <div class="main-song song">
                    <img src="../img/test_img.jpg" class="album">
                    <img src="../img/test_img.jpg" class="bg">
                    <div class="nameWrapper">
                        <h1>NameNameName</h1>
                        <h2>AuthorAuthorAuthor</h2>
                        <div class="buttons-wrapper">
                            <div class="button play">
                                <img src="../img/play_context.svg">
                                <p>Play</p>
                            </div>
                            <div class="button play-next">
                                <img src="../img/insert.svg">
                                <p>Play next</p>
                            </div>
                            <div class="button add-to-queue">
                                <img src="../img/append.svg">
                                <p>Add to queue</p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <template id="reqular-song-template">
                <div class="regular-song song">
                    <img src="../img/test_img.jpg" class="album">
                    <img src="../img/play.svg" class="album-play">
                    <div class="nameWrapper">
                        <h1>NameNameName</h1>
                        <h2>AuthorAuthorAuthor</h2>
                    </div>
                    <img src="../img/more.svg" alt="more" class="more">
                </div>
            </template>
            <template id="main-artist-template">
                <div class="main-artist song">
                    <img src="../img/test_img.jpg" class="album">
                    <img src="../img/test_img.jpg" class="bg">
                    <div class="nameWrapper">
                        <h1>NameNameName</h1>
                        <h2>AuthorAuthorAuthor</h2>
                        <div class="buttons-wrapper">
                            <div class="button shuffle">
                                <img src="../img/play_context.svg">
                                <p>Shuffle</p>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <template id="regular-artist-template">
                <div class="regular-artist song">
                    <img src="../img/test_img.jpg" class="album">
                    <div class="nameWrapper">
                        <h1>NameNameName</h1>
                        <h2>AuthorAuthorAuthor</h2>
                    </div>
                </div>
            </template>
        </div>

        <div class="musicbar">
            <div class="wrapper-small">
                <div class="control-buttons-wrapper">
                    <button class="btn-prev" disabled></button>
                    <button class="btn-play-pause" disabled></button>
                    <button class="btn-next" disabled></button>
                </div>
                <img src="../img/no_music.png" class="album">
                <div class="textWrapper">
                    <h1></h1>
                    <h2></h2>
                </div>
                
                <!-- <div class="test"></div> -->
                <div class="volume-wrapper">
                    <div class="unfilled-range"></div>
                    <div class="filled-range"></div>
                    <input type="range" id="volume-range-small" min="0" max="100" value="30">
                </div>
                <button class="volume"></button>
                <button class="open-close"></button>
            </div>
            <div class="wrapper-big">
                <div class="music-player">
                    <img src="../img/no_music.png" class="album">
                    <div class="timeline-wrapper">
                        <p class="current">0.05</p>
                        <div class="timeline-range-wrapper">
                            <div class="unfilled-range"></div>
                            <div class="filled-range"></div>
                            <input type="range" id="timeline-range" min="0" max="100" value="30">
                        </div>
                        <p class="duration">3.55</p>
                    </div>
                </div>
                <div class="queue">
                    <div class="butons-wrapper">
                        <div class="buttons-background">
                            <div class="item active" id="queue-btn">
                                <p>Queue</p>
                            </div>
                            <div class="item" id="lyrics-btn">
                                <p>Lyrics</p>
                            </div>
                        </div>
                    </div>
                    <ul class="queue-list">
                        <li class="first" draggable="false"></li>
                        <template id="queue-song">
                            <li class="song" draggable="true">
                                <img src="../img/no_music.png" alt="song image" class="song-img">
                                <img src="../img/playing.svg" class="song-img-active">
                                <div class="textWrapper">
                                    <h1>NameNameName</h1>
                                    <h2>NameNameName</h2>
                                </div>
                                <p class="duration">2:39</p>
                            </li>
                        </template>
                    </ul>
                    <ul class="lyrics-list">
                        <div class="wrapper"></div>
                        <p class="active">Loading...</p>
                        <div class="wrapper"></div>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="../common/musicbar.js"></script>
    <script src="../common/sliderbar.js"></script>
</body>
</html>

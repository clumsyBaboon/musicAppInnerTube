<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>Use saved cookie automatically</h1>
        <input type="checkbox" id="autoCookie">

        <h1>Max cached songs</h1>
        <select id="cached-songs">
            <option value="compact">Compact | 15 Songs</option>
            <option value="medium">Medium | 50 Songs</option>
            <option value="extended">Extended | 100 Songs</option>
        </select>

        <button class="primary" style="grid-column: span 2;" id="close">
            <p>Close</p>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>

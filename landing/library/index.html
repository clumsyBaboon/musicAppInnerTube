<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common/slidebar.css">
</head>
<body>
    <div class="wrapper">
        <div class="titlebar"></div>

        <div class="slidebar">
            <img src="../img/settings.svg" alt="settings" id="settings">
            <div class="buttons">
                <button>
                    <img src="../img/search.svg" alt="search">
                    <p>Search</p>
                </button>
                <button class="active">
                    <img src="../img/library.svg" alt="library">
                    <p>Library</p>
                </button>
                <button>
                    <img src="../img/coverflow.svg" alt="coverflow">
                    <p>Coverflow</p>
                </button>
            </div>
            <button id="account-btn">
                <img src="" alt="" id="account-img">
                <div id="scrolling-wrapper">
                    <p id="account-name">Name</p>
                </div>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="../common/sliderbar.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../common/slidebar.css">
    <link rel="stylesheet" href="../common/loading.css">
    <link rel="stylesheet" href="../common/musicbar.css">
</head>
<body>
    <div class="wrapper">
        <div class="titlebar"></div>

        <div class="slidebar">
            <img src="../img/settings.svg" alt="settings" id="settings">
            <div class="buttons">
                <button>
                    <img src="../img/search.svg" alt="search">
                    <p>Search</p>
                </button>
                <button class="active">
                    <img src="../img/library.svg" alt="library">
                    <p>Library</p>
                </button>
                <button>
                    <img src="../img/coverflow.svg" alt="coverflow">
                    <p>Coverflow</p>
                </button>
            </div>
            <button id="account-btn">
                <img src="" alt="" id="account-img">
                <div id="scrolling-wrapper">
                    <p id="account-name">Name</p>
                </div>
            </button>
        </div>

        <div class="playlistWrapper">
            <template id="playlistWrapperTemplate">
                <div class="playlist">
                    <div class="textWrapper">
                        <h1>Мой плейлист №3 плейлист №3</h1>
                        <h2>clumsyBaboon • 420 tracks</h2>
                    </div>
                    <img src="../img/no_music.png">
                </div>
            </template>
        </div>

        <div class="playlistViewWrapper">
            <img src="../img/loading.png" alt="loading" class="loading" id="loading-playlist">
            <div class="mainPlaylist">
                <div class="front"></div>
                <div class="back"></div>
            </div>
            
            <div class="wrapper">
                <img src="../img/close.svg" alt="close playlist" id="closePlaylist">
                <div class="transparent-box"></div>
                <div class="songs">
                    <h1 id="playlistName"></h1>
                    <div class="start-playlist">
                        <img src="../img/play.svg" alt="">
                        <p>Play</p>
                    </div>
                    <template id="songTemplate">
                        <div class="song">
                            <p class="index">1</p>
                            <img src="../img/no_music.png" alt="song image" class="song-img">
                            <div class="textWrapper">
                                <h1>NameNameName</h1>
                                <h2>NameNameName</h2>
                            </div>
                            <p class="duration">2:39</p>
                            <img src="../img/more.svg" alt="more" class="more">
                        </div>
                    </template>
                </div>
                

            </div>
        </div>

        <div class="musicbar">
            <div class="wrapper-small">
                <div class="control-buttons-wrapper">
                    <button class="btn-prev" disabled></button>
                    <button class="btn-play-pause" disabled></button>
                    <button class="btn-next" disabled></button>
                </div>
                <img src="../img/no_music.png" class="album">
                <div class="textWrapper">
                    <h1></h1>
                    <h2></h2>
                </div>
                
                <!-- <div class="test"></div> -->
                <div class="volume-wrapper">
                    <div class="unfilled-range"></div>
                    <div class="filled-range"></div>
                    <input type="range" id="volume-range-small" min="0" max="100" value="30">
                </div>
                <button class="volume"></button>
                <button class="open-close"></button>
            </div>
            <div class="wrapper-big">
                <div class="music-player">
                    <img src="../img/no_music.png" class="album">
                    <div class="timeline-wrapper">
                        <p class="current">0.05</p>
                        <div class="timeline-range-wrapper">
                            <div class="unfilled-range"></div>
                            <div class="filled-range"></div>
                            <input type="range" id="timeline-range" min="0" max="100" value="30">
                        </div>
                        <p class="duration">3.55</p>
                    </div>
                </div>
                <div class="queue">
                    <div class="butons-wrapper"></div>
                    <ul class="queue-list">
                        <li class="first" draggable="false"></li>
                        <template id="queue-song">
                            <li class="song" draggable="true">
                                <img src="../img/no_music.png" alt="song image" class="song-img">
                                <img src="../img/playing.svg" class="song-img-active">
                                <div class="textWrapper">
                                    <h1>NameNameName</h1>
                                    <h2>NameNameName</h2>
                                </div>
                                <p class="duration">2:39</p>
                            </li>
                        </template>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="../common/musicbar.js"></script>
    <script src="../common/sliderbar.js"></script>
</body>
</html>
